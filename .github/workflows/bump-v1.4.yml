name: Bump release to v1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/bump-v1.4.py'
      - '.github/workflows/bump-v1.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v1.4 version bump
        run: python3 .github/scripts/bump-v1.4.py
      - name: Validate shell syntax
        run: |
          bash -n Export_Game_Library.sh
          bash -n Update_Game_Library.sh
      - name: Validate v1.4 contract
        run: |
          set -euo pipefail
          grep -Fqx '# Export_Game_Library_v1.4.sh' Export_Game_Library.sh
          grep -Fqx '# Update_Game_Library_v1.4.sh' Update_Game_Library.sh
          grep -Fq 'exporter_version=1.4' Export_Game_Library.sh
          grep -Fq 'EXPORTER_VERSION=1.4' Export_Game_Library.sh
          grep -Fq 'EXPECTED_EXPORTER_VERSION="1.4"' Update_Game_Library.sh
          grep -Fq 'Current release: v1.4' README.md
          grep -Fq 'current release is **v1.4**' PROJECT_CONTEXT.md
          grep -Fqx 'FULL_VERIFY_WORKERS=2' Export_Game_Library.sh
      - name: Synthetic regression
        run: bash tests/test_exporter_synthetic.sh
      - name: Commit v1.4
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Export_Game_Library.sh Update_Game_Library.sh README.md PROJECT_CONTEXT.md wiki tests .github/workflows
          if git diff --cached --quiet; then
            echo 'v1.4 already applied.'
            exit 0
          fi
          git commit -m 'Release v1.4'
          git push origin HEAD:main
