name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          TAG="v$VERSION"
          ! git rev-parse "$TAG" >/dev/null 2>&1 || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release-ready source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          grep -Fq "Export_Game_Library_v${VERSION}.sh" Export_Game_Library.sh
          grep -Fq "Update_Game_Library_v${VERSION}.sh" Update_Game_Library.sh
          grep -Fq "EXPECTED_EXPORTER_VERSION=\"${VERSION}\"" Update_Game_Library.sh
          grep -Fq "Current release: v${VERSION}" README.md
          grep -Fq "current release is **v${VERSION}**" PROJECT_CONTEXT.md
          bash -n Export_Game_Library.sh
          bash -n Update_Game_Library.sh

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "MiSTer ROM Library Auditor $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "MiSTer ROM Library Auditor $TAG" --generate-notes --verify-tag
