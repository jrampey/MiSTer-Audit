name: Commit validated Issue 7 fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/commit-issue-7.yml"]
permissions: {contents: write}
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('Export_Game_Library.sh'); t=p.read_text()
          old='''  if [ "$pre_collision" -eq 1 ]; then\n    authoritative=0; case "$dat_status" in "Exact SHA-1"|"Normalized SHA-1") [ -n "$proposed" ] && authoritative=1 ;; esac\n    printf '%s\\t%s\\t%s\\n' "$key" "$authoritative" "${proposed,,}" >> "$COLLISION_ROWS"\n    if [ "$authoritative" -eq 1 ]; then collision="Canonical DAT variant candidate"; else collision="Blocking collision candidate"; fi\n  fi'''
          new='''  # Record every final target so canonical duplicates are detected even when fallback names differ.\n  authoritative=0; case "$dat_status" in "Exact SHA-1"|"Normalized SHA-1") [ -n "$proposed" ] && authoritative=1 ;; esac\n  printf '%s\\t%s\\t%s\\t%s\\t%s\\n' "$p" "$key" "$pre_collision" "$authoritative" "${system,,}|${proposed,,}" >> "$COLLISION_ROWS"\n  if [ "$pre_collision" -eq 1 ]; then if [ "$authoritative" -eq 1 ]; then collision="Canonical DAT variant candidate"; else collision="Blocking collision candidate"; fi; fi'''
          assert t.count(old)==1; t=t.replace(old,new,1)
          s=t.index('# Issue #7: decide collision safety only after final DAT-driven targets are known.'); e=t.index('\n\nCOMPLETION_REGION_LABEL=',s)
          block=r'''# Issue #7: evaluate both pre-DAT groups and duplicate final targets.
          if [ -s "$COLLISION_ROWS" ]; then
            read -r COLLISIONS RESOLVED_COLLISIONS < <(awk -F '\t' '
              { group[NR]=$2; pre[NR]=$3+0; auth[NR]=$4+0; target[NR]=$5; final_count[$5]++; if(pre[NR]){group_rows[$2]++;group_auth[$2]+=auth[NR];group_target[$2 SUBSEP $5]++} }
              END {
                for(g in group_rows){duplicate=0;prefix=g SUBSEP;for(k in group_target)if(index(k,prefix)==1&&group_target[k]>1){duplicate=1;break};group_safe[g]=(group_auth[g]==group_rows[g]&&!duplicate)}
                blocking=0;resolved=0
                for(i=1;i<=NR;i++){is_blocking=(final_count[target[i]]>1)||(pre[i]&&!group_safe[group[i]]);if(is_blocking)blocking++;else if(pre[i])resolved++}
                print blocking,resolved
              }' "$COLLISION_ROWS")
            COLLISIONS=${COLLISIONS:-0}; RESOLVED_COLLISIONS=${RESOLVED_COLLISIONS:-0}
          fi'''
          p.write_text(t[:s]+block+t[e:])

          b=Path('tests/build_synthetic_library.py'); x=b.read_text(); m='    # The bulk profile uses an intentionally unsupported hash extension that is\n'; assert x.count(m)==1
          x=x.replace(m,'    # Issue #7: distinct canonical revisions sharing one fallback title.\n    (special / "Canonical Variant (USA) (Rev 1).sfc").write_bytes(b"issue7-rev1\\n")\n    (special / "Canonical Variant (USA) (Rev 2).sfc").write_bytes(b"issue7-rev2\\n")\n    created += 2\n    ambiguous = games / "GameGear"; ambiguous.mkdir(parents=True, exist_ok=True)\n    (ambiguous / "Ambiguous Collision (USA) (Rev 1).gg").write_bytes(b"ambiguous-1\\n")\n    (ambiguous / "Ambiguous Collision (USA) (Rev 2).gg").write_bytes(b"ambiguous-2\\n")\n    created += 2\n\n'+m,1); b.write_text(x)
          q=Path('tests/test_exporter_synthetic.sh'); x=q.read_text(); m='python3 - "$TEST_BIN/Export_Game_Library.sh" "$ROOT" <<\'PY\'\n'; assert x.count(m)==1
          add=r'''for rev in 1 2; do
            vp="$ROOT/games/SNES/Canonical Variant (USA) (Rev $rev).sfc"; vh=$(sha1sum "$vp" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$vh" "Canonical Variant (USA) (Rev $rev)" "Canonical Variant (USA) (Rev $rev).sfc" "Synthetic Issue #7" "12" "00000000" "00000000000000000000000000000000" "SNES" "SNES" "SNES" "USA" "Revision" "Licensed" >> "$TEST_BIN/mister_hash_database.tsv"
          done
          '''; x=x.replace(m,add+m,1)
          x=x.replace('verdict=$(value_after_colon "Audit integrity verdict")\n','verdict=$(value_after_colon "Audit integrity verdict")\nblocking=$(value_after_colon "Blocking collision rows")\nresolved=$(value_after_colon "Canonical DAT variant rows resolved safely")\n',1)
          x=x.replace('[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n','[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n[ "$resolved" -eq 2 ] || fail "resolved canonical variants=$resolved expected=2"\n[ "$blocking" -eq 4 ] || fail "blocking collision rows=$blocking expected=4"\n',1)
          x=x.replace("grep -Fq 'Synthetic GameGear 05746' \"$CATALOG\" || fail \"tail sentinel missing\"","grep -Fq 'Synthetic GameGear 05742' \"$CATALOG\" || fail \"tail sentinel missing\"")
          q.write_text(x)
          Path('README.md').write_text(Path('README.md').read_text()+'\n\nIssue #7 final-target duplicate detection spans the complete catalog, so differently named sources resolving to the same canonical target remain blocking.\n')
          Path('PROJECT_CONTEXT.md').write_text(Path('PROJECT_CONTEXT.md').read_text()+'\n\nIssue #7 records every final target, not only pre-DAT collision groups, so identical canonical targets from differently named sources remain blocking.\n')
          Path('wiki/Audit-Safety.md').write_text(Path('wiki/Audit-Safety.md').read_text()+'\n\nFinal-target duplicate detection spans the complete catalog, including differently named source files that resolve to one identical canonical DAT filename.\n')
          PY
          bash -n Export_Game_Library.sh
          bash -n tests/test_exporter_synthetic.sh
          python3 -m py_compile tests/build_synthetic_library.py
      - name: Rebuild Downloader db
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/db; CSV=/tmp/db/files.csv; RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"
          add(){ printf '%s,%s/%s,%s,%s,%s\n' "$2" "$RAW" "$1" "$(stat -c '%s' "$1")" "$(md5sum "$1"|awk '{print $1}')" mister-rom-library-auditor >> "$CSV"; }
          add Export_Game_Library.sh Scripts/Export_Game_Library.sh; add Update_Game_Library.sh Scripts/Update_Game_Library.sh; add mister_hash_database.tsv Scripts/mister_hash_database.tsv
          curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py -o /tmp/db/op.py
          DB_ID="jrampey/MiSTer-ROM-Library-Auditor" DB_URL="$RAW/db.json" BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" EXTERNAL_FILES="$CSV" FINDER_IGNORE="Export_Game_Library.sh Update_Game_Library.sh mister_hash_database.tsv README.md PROJECT_CONTEXT.md wiki" DB_JSON_NAME=db.json python3 /tmp/db/op.py build .
      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-issue-7.yml .github/workflows/apply-issue-7-v2.yml .github/workflows/apply-issue-7-v3.yml .github/workflows/validate-issue-7.yml .github/workflows/finalize-issue-7.yml .github/workflows/commit-issue-7.yml
          git add Export_Game_Library.sh tests/build_synthetic_library.py tests/test_exporter_synthetic.sh README.md PROJECT_CONTEXT.md wiki/Audit-Safety.md db.json
          git commit -m "Complete Issue #7 final-target collision safety"
          git push
