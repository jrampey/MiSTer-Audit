name: Finalize Issue 7 canonical target safety
on:
  push:
    branches: [main]
    paths: [".github/workflows/finalize-issue-7.yml"]
permissions: {contents: write}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fix final-target collision accounting and add regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('Export_Game_Library.sh'); t=p.read_text()
          old='''  if [ "$pre_collision" -eq 1 ]; then\n    authoritative=0; case "$dat_status" in "Exact SHA-1"|"Normalized SHA-1") [ -n "$proposed" ] && authoritative=1 ;; esac\n    printf '%s\\t%s\\t%s\\n' "$key" "$authoritative" "${proposed,,}" >> "$COLLISION_ROWS"\n    if [ "$authoritative" -eq 1 ]; then collision="Canonical DAT variant candidate"; else collision="Blocking collision candidate"; fi\n  fi'''
          new='''  # Record every final target so canonical duplicates are detected even when\n  # their pre-DAT fallback names differ. Pre-collision membership is retained\n  # separately so unique authoritative revisions can be resolved safely.\n  authoritative=0; case "$dat_status" in "Exact SHA-1"|"Normalized SHA-1") [ -n "$proposed" ] && authoritative=1 ;; esac\n  printf '%s\\t%s\\t%s\\t%s\\t%s\\n' "$p" "$key" "$pre_collision" "$authoritative" "${system,,}|${proposed,,}" >> "$COLLISION_ROWS"\n  if [ "$pre_collision" -eq 1 ]; then\n    if [ "$authoritative" -eq 1 ]; then collision="Canonical DAT variant candidate"; else collision="Blocking collision candidate"; fi\n  fi'''
          if t.count(old)!=1: raise SystemExit(f'row block count={t.count(old)}')
          t=t.replace(old,new,1)
          start=t.index('# Issue #7: decide collision safety only after final DAT-driven targets are known.')
          end=t.index('\n\nCOMPLETION_REGION_LABEL=',start)
          block=r'''# Issue #7: decide collision safety only after every final target is known.
          # Safety rules:
          # - duplicate final targets are always blocking, even when fallback names differ;
          # - a pre-DAT collision group is resolved only when every row is authoritative
          #   and every final target in that group is unique;
          # - unmatched, unsupported, mixed, and ambiguous pre-collision groups block Apply.
          if [ -s "$COLLISION_ROWS" ]; then
            read -r COLLISIONS RESOLVED_COLLISIONS < <(awk -F '\t' '
              {
                path[NR]=$1; group[NR]=$2; pre[NR]=$3+0; auth[NR]=$4+0; target[NR]=$5
                final_count[$5]++
                if (pre[NR]) { group_rows[$2]++; group_auth[$2]+=auth[NR]; group_target[$2 SUBSEP $5]++ }
              }
              END {
                for (g in group_rows) {
                  duplicate=0; prefix=g SUBSEP
                  for (k in group_target) if (index(k,prefix)==1 && group_target[k]>1) { duplicate=1; break }
                  group_safe[g]=(group_auth[g]==group_rows[g] && !duplicate)
                }
                blocking=0; resolved=0
                for (i=1; i<=NR; i++) {
                  is_blocking=(final_count[target[i]]>1) || (pre[i] && !group_safe[group[i]])
                  if (is_blocking) blocking++
                  else if (pre[i]) resolved++
                }
                print blocking, resolved
              }' "$COLLISION_ROWS")
            COLLISIONS=${COLLISIONS:-0}; RESOLVED_COLLISIONS=${RESOLVED_COLLISIONS:-0}
          fi'''
          t=t[:start]+block+t[end:]
          p.write_text(t)

          b=Path('tests/build_synthetic_library.py'); x=b.read_text(); m='    # The bulk profile uses an intentionally unsupported hash extension that is\n'; assert x.count(m)==1
          add='''    # Issue #7: same fallback title, distinct authoritative canonical revisions.\n    (special / "Canonical Variant (USA) (Rev 1).sfc").write_bytes(b"issue7-rev1\\n")\n    (special / "Canonical Variant (USA) (Rev 2).sfc").write_bytes(b"issue7-rev2\\n")\n    created += 2\n\n    # Issue #7: unsupported ambiguous rows with the same fallback remain blocking.\n    ambiguous = games / "GameGear"\n    ambiguous.mkdir(parents=True, exist_ok=True)\n    (ambiguous / "Ambiguous Collision (USA) (Rev 1).gg").write_bytes(b"ambiguous-1\\n")\n    (ambiguous / "Ambiguous Collision (USA) (Rev 2).gg").write_bytes(b"ambiguous-2\\n")\n    created += 2\n\n'''; b.write_text(x.replace(m,add+m,1))

          q=Path('tests/test_exporter_synthetic.sh'); x=q.read_text(); m='python3 - "$TEST_BIN/Export_Game_Library.sh" "$ROOT" <<\'PY\'\n'; assert x.count(m)==1
          add=r'''# Issue #7: authoritative revision pair that collides before DAT identity.
          for rev in 1 2; do
            vp="$ROOT/games/SNES/Canonical Variant (USA) (Rev $rev).sfc"; vh=$(sha1sum "$vp" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$vh" "Canonical Variant (USA) (Rev $rev)" "Canonical Variant (USA) (Rev $rev).sfc" "Synthetic Issue #7" "12" "00000000" "00000000000000000000000000000000" "SNES" "SNES" "SNES" "USA" "Revision" "Licensed" >> "$TEST_BIN/mister_hash_database.tsv"
          done

          '''; x=x.replace(m,add+m,1)
          x=x.replace('verdict=$(value_after_colon "Audit integrity verdict")\n','verdict=$(value_after_colon "Audit integrity verdict")\nblocking=$(value_after_colon "Blocking collision rows")\nresolved=$(value_after_colon "Canonical DAT variant rows resolved safely")\n',1)
          x=x.replace('[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n','[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n[ "$resolved" -eq 2 ] || fail "resolved canonical variants=$resolved expected=2"\n[ "$blocking" -eq 4 ] || fail "blocking collision rows=$blocking expected=4"\n',1)
          x=x.replace('echo "Synthetic Full Verification regression test passed."','grep -F \'Canonical Variant\' "$CATALOG" | grep -Fq \'Canonical DAT variant candidate\' || fail "canonical DAT variant candidates missing"\ngrep -F \'Ambiguous Collision\' "$CATALOG" | grep -Fq \'Blocking collision candidate\' || fail "unsupported blocking candidates missing"\n\necho "Synthetic Full Verification regression test passed."',1); q.write_text(x)

          Path('README.md').write_text(Path('README.md').read_text()+'\n\nIssue #7 also evaluates duplicate **final** canonical targets across the complete catalog, even when their original fallback names differ. Identical final targets and hash-identical canonical duplicates remain blocking.\n')
          Path('PROJECT_CONTEXT.md').write_text(Path('PROJECT_CONTEXT.md').read_text()+'\n\nIssue #7 final-target accounting records every catalog row, not only pre-DAT collision groups. This is required so two differently named source files that resolve to one identical canonical DAT target remain blocking.\n')
          Path('wiki/Audit-Safety.md').write_text(Path('wiki/Audit-Safety.md').read_text()+'\n\nFinal-target duplicate detection spans the complete catalog. Two source files with different fallback names that resolve to the same canonical DAT filename are still a blocking collision; this explicitly covers the Issue #6 apostrophe-bearing duplicate-canonical regression.\n')
          PY
      - name: Run complete synthetic Full Verification
        shell: bash
        run: |
          set -euo pipefail
          bash -n Export_Game_Library.sh
          bash -n tests/test_exporter_synthetic.sh
          python3 -m py_compile tests/build_synthetic_library.py
          CI=true bash tests/test_exporter_synthetic.sh
      - name: Rebuild and validate Downloader db
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/db /tmp/dl; CSV=/tmp/db/files.csv; RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"
          add(){ printf '%s,%s/%s,%s,%s,%s\n' "$2" "$RAW" "$1" "$(stat -c '%s' "$1")" "$(md5sum "$1"|awk '{print $1}')" mister-rom-library-auditor >> "$CSV"; }
          add Export_Game_Library.sh Scripts/Export_Game_Library.sh; add Update_Game_Library.sh Scripts/Update_Game_Library.sh; add mister_hash_database.tsv Scripts/mister_hash_database.tsv
          curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py -o /tmp/db/op.py
          DB_ID="jrampey/MiSTer-ROM-Library-Auditor" DB_URL="$RAW/db.json" BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" EXTERNAL_FILES="$CSV" FINDER_IGNORE="Export_Game_Library.sh Update_Game_Library.sh mister_hash_database.tsv README.md PROJECT_CONTEXT.md wiki" DB_JSON_NAME=db.json python3 /tmp/db/op.py build .
          curl -fsSL https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py -o /tmp/dl/test.py; chmod +x /tmp/dl/test.py; (cd /tmp/dl && ./test.py jrampey/MiSTer-ROM-Library-Auditor "$GITHUB_WORKSPACE/db.json")
      - name: Commit complete fix and cleanup temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-issue-7.yml .github/workflows/apply-issue-7-v2.yml .github/workflows/apply-issue-7-v3.yml .github/workflows/validate-issue-7.yml .github/workflows/finalize-issue-7.yml
          git add Export_Game_Library.sh tests/build_synthetic_library.py tests/test_exporter_synthetic.sh README.md PROJECT_CONTEXT.md wiki/Audit-Safety.md db.json
          git commit -m "Complete Issue #7 final-target collision safety"
          git push
