name: MiSTer Runtime Compatibility

on:
  push:
    branches: [main]
    paths:
      - "MiSTer_Audit.sh"
      - "tests/**"
      - ".github/workflows/mister-compatibility.yml"
  pull_request:
    paths:
      - "MiSTer_Audit.sh"
      - "tests/**"
      - ".github/workflows/mister-compatibility.yml"
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated runtime
        run: bash tools/build_runtime.sh --check
      - name: Bash syntax
        run: bash -n MiSTer_Audit.sh
      - name: ShellCheck advisory
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x MiSTer_Audit.sh || echo "::warning::ShellCheck reported advisory findings; this does not fail CI."
          else
            echo "::warning::ShellCheck is unavailable on this runner; skipping advisory lint."
          fi
      - name: Guard MiSTer runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Exporter must remain self-contained on MiSTer. Python/sqlite/jq/perl are
          # intentionally forbidden runtime dependencies. CI/tests/tools may use them.
          if grep -nE '(^|[;&|[:space:]])(python3?|sqlite3|jq|perl)([;&|[:space:]]|$)' MiSTer_Audit.sh; then
            echo "Unsupported MiSTer runtime dependency detected in exporter."
            exit 1
          fi
          # Flag common GNU-only long options in the runtime script. Add an explicit
          # exception only after confirming the option exists on the target MiSTer image.
          if grep -nE -- '--(parallel|files0-from|zero-terminated|printf|time-style|sort=)' MiSTer_Audit.sh; then
            echo "Potential GNU-only runtime option detected."
            exit 1
          fi
      - name: Synthetic compatibility regression
        run: bash tests/test_exporter_synthetic.sh
