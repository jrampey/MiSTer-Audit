name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid version: $INPUT_VERSION"; exit 1; }
          TAG="v$VERSION"
          ! git rev-parse "$TAG" >/dev/null 2>&1 || { echo "Tag $TAG already exists"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate hash database
        run: python3 tools/validate_hash_database.py mister_hash_database.tsv --min-records 40000

      - name: Bump runtime and documentation versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          v = os.environ["VERSION"]
          def replace(path, substitutions):
              p = Path(path); text = p.read_text()
              for pattern, replacement in substitutions: text = re.sub(pattern, replacement, text)
              p.write_text(text)
          replace("MiSTer_Audit.sh", [(r"# MiSTer_Audit\\.sh v[0-9.]+", f"# MiSTer_Audit.sh v{v}"),(r"exporter_version=[0-9.]+", f"exporter_version={v}"),(r'EXPECTED_EXPORTER_VERSION="[0-9.]+"', f'EXPECTED_EXPORTER_VERSION="{v}"'),(r"MiSTer ROM Library Auditor v[0-9.]+", f"MiSTer ROM Library Auditor v{v}"),(r"MiSTer ROM Library Updater v[0-9.]+", f"MiSTer ROM Library Updater v{v}")])
          replace("README.md", [(r"Current release: v[0-9.]+", f"Current release: v{v}"),(r"`MiSTer-Audit-Export\.sh` v[0-9.]+", f"`MiSTer_Audit.sh` v{v}"),(r"`MiSTer-Audit-Update\.sh` v[0-9.]+", f"`MiSTer_Audit.sh` v{v}"),(r"v[0-9.]+ uses DAT metadata", f"v{v} uses DAT metadata"),(r"v[0-9.]+ updater safety handshake", f"v{v} updater safety handshake"),(r"expected v[0-9.]+ audit contract", f"expected v{v} audit contract"),(r"v[0-9.]+ integrity checks", f"v{v} integrity checks"),(r"passing v[0-9.]+ audit", f"passing v{v} audit"),(r"release remains v[0-9.]+", f"release remains v{v}")])
          replace("PROJECT_CONTEXT.md", [(r"current release is \*\*v[0-9.]+\*\*", f"current release is **v{v}**"),(r"is the \*\*v[0-9.]+\*\* auditor", f"is the **v{v}** auditor"),(r"is the \*\*v[0-9.]+\*\* companion updater", f"is the **v{v}** companion updater"),(r"Important v[0-9.]+ work", f"Important v{v} work")])
          replace("wiki/Rename-Workflow.md", [(r"`MiSTer-Audit-Update\.sh` v[0-9.]+", f"`MiSTer_Audit.sh` v{v}"),(r"expected v[0-9.]+ audit contract", f"expected v{v} audit contract"),(r"exporter version `[0-9.]+`", f"exporter version `{v}`"),(r"both \*\*v[0-9.]+\*\*", f"both **v{v}**"),(r"auditor's v[0-9.]+ integrity metadata", f"auditor's v{v} integrity metadata")])
          PY

      - name: Validate release-ready source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          grep -Fq "MiSTer_Audit.sh v${VERSION}" MiSTer_Audit.sh
          grep -Fq "EXPECTED_EXPORTER_VERSION=\"${VERSION}\"" MiSTer_Audit.sh
          grep -Fq "Current release: v${VERSION}" README.md
          grep -Fq "current release is **v${VERSION}**" PROJECT_CONTEXT.md
          grep -Fq "both **v${VERSION}**" wiki/Rename-Workflow.md
          bash -n MiSTer_Audit.sh

      - name: Build Downloader database
        run: |
          set -euo pipefail
          mkdir -p /tmp/mister-db-build
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          CSV="/tmp/mister-db-build/external_files.csv"
          printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"
          add_file() { local source="$1" target="$2" size md5; size=$(stat -c '%s' "$source"); md5=$(md5sum "$source" | awk '{print $1}'); printf '%s,%s/%s,%s,%s,%s\n' "$target" "$RAW_BASE" "$source" "$size" "$md5" "mister-rom-library-auditor" >> "$CSV"; }
          add_file "MiSTer_Audit.sh" "Scripts/MiSTer_Audit.sh"
          add_file "mister_hash_database.tsv" "Scripts/mister_hash_database.tsv"
          curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py -o /tmp/mister-db-build/db_operator.py
          DB_ID="jrampey/MiSTer-ROM-Library-Auditor" DB_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/db.json" BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" EXTERNAL_FILES="$CSV" FINDER_IGNORE="MiSTer_Audit.sh mister_hash_database.tsv README.md PROJECT_CONTEXT.md wiki" DB_JSON_NAME="db.json" python3 /tmp/mister-db-build/db_operator.py build .

      - name: Verify Downloader manifest matches release files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {"Scripts/MiSTer_Audit.sh": Path("MiSTer_Audit.sh"), "Scripts/mister_hash_database.tsv": Path("mister_hash_database.tsv")}
          db = json.loads(Path("db.json").read_text()); files = db.get("files", {}); errors = []
          for target, source in expected.items():
              entry = files.get(target)
              if not entry: errors.append(f"missing Downloader entry: {target}"); continue
              data = source.read_bytes(); actual_size = len(data); actual_md5 = hashlib.md5(data).hexdigest()
              if entry.get("size") != actual_size: errors.append(f"{target}: size mismatch db={entry.get('size')} source={actual_size}")
              if entry.get("hash", "").lower() != actual_md5: errors.append(f"{target}: MD5 mismatch db={entry.get('hash')} source={actual_md5}")
          unexpected = sorted(k for k in files if k.startswith("Scripts/") and k not in expected)
          if unexpected: errors.append("unexpected distributed Scripts entries: " + ", ".join(unexpected))
          if errors: raise SystemExit("Downloader manifest reproducibility check failed:\n- " + "\n- ".join(errors))
          print("Downloader manifest exactly matches the release runtime files.")
          PY

      - name: Validate database with MiSTer Downloader
        run: |
          set -euo pipefail
          mkdir -p /tmp/downloader-test
          curl -fsSL https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py -o /tmp/downloader-test/downloader_test.py
          chmod +x /tmp/downloader-test/downloader_test.py
          cd /tmp/downloader-test
          ./downloader_test.py "jrampey/MiSTer-ROM-Library-Auditor" "$GITHUB_WORKSPACE/db.json"

      - name: Commit release version and Downloader database
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MiSTer_Audit.sh README.md PROJECT_CONTEXT.md wiki/Rename-Workflow.md db.json
          git diff --cached --quiet && { echo "No release changes found"; exit 1; }
          git commit -m "Release v${VERSION}"
          git push origin HEAD:main

      - name: Verify committed release contents
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || { echo "Working tree changed after release commit"; git status --short; exit 1; }
          python3 - <<'PY'
          import hashlib, json, subprocess
          expected = {"Scripts/MiSTer_Audit.sh": "MiSTer_Audit.sh", "Scripts/mister_hash_database.tsv": "mister_hash_database.tsv"}
          db = json.loads(subprocess.check_output(["git", "show", "HEAD:db.json"], text=True)); errors = []
          for target, path in expected.items():
              data = subprocess.check_output(["git", "show", f"HEAD:{path}"]); entry = db["files"].get(target, {}); size = len(data); md5 = hashlib.md5(data).hexdigest()
              if entry.get("size") != size or entry.get("hash", "").lower() != md5: errors.append(f"{target} does not match committed source")
          if errors: raise SystemExit("Committed release verification failed:\n- " + "\n- ".join(errors))
          print("Committed release files and db.json are byte-for-byte consistent.")
          PY

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "MiSTer ROM Library Auditor $TAG"
          TAGGED_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          [[ "$TAGGED_COMMIT" == "$HEAD_COMMIT" ]] || { echo "Tag target mismatch"; exit 1; }
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "MiSTer ROM Library Auditor $TAG" --generate-notes --verify-tag
