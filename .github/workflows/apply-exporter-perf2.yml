name: Apply exporter audit correctness patch
on:
  push:
    paths:
      - '.github/workflows/apply-exporter-perf2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exporter
        run: python3 .github/scripts/apply-exporter-perf2.py
      - name: Validate exporter
        run: |
          bash -n Export_Game_Library.sh
          grep -F 'SAFE TO PREVIEW (COLLISIONS SKIPPED)' Export_Game_Library.sh
          grep -F 'Expected support/non-retail' Export_Game_Library.sh
          grep -F 'canonical_dat_system "$meta_system"' Export_Game_Library.sh
          grep -F 'sgb|supergameboy' Export_Game_Library.sh
          grep -F 'HASH_NEXT_STATUS=500' Export_Game_Library.sh
          bash tests/test_exporter_synthetic.sh
      - name: Commit exporter fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Export_Game_Library.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Fix audit correctness and collision preview semantics'
          git push
