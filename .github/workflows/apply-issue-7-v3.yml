name: Apply Issue 7 canonical collision fix v3
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-issue-7-v3.yml"]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply line-safe patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('Export_Game_Library.sh'); t=p.read_text()
          def replace1(old,new):
              global t
              n=t.count(old)
              if n!=1: raise RuntimeError(f'anchor count {n}: {old[:80]!r}')
              t=t.replace(old,new,1)
          pre=r'''# Resolve fallback collisions against authoritative final DAT targets.
          # Only all-DAT groups with unique canonical targets are non-blocking.
          declare -A COLLISION_GROUP_AUTH_COUNT COLLISION_FINAL_COUNTS COLLISION_SHA_BY_PATH
          while IFS=$'\t' read -r csystem cp cfile cext cstem cclean cregion ckind; do
            [ -z "$cp" ] && continue
            csuffix="$(suffix_for "$cregion" "$ckind")"; cfallback="$cclean$csuffix.$cext"
            cgroup="${csystem,,}|${cfallback,,}"; cgroup_count="${NAME_COUNTS["$cgroup"]:-0}"
            [ "$cgroup_count" -gt 1 ] 2>/dev/null || continue
            cfinal="$cfallback"; cauthoritative=0; craw=""
            if should_hash "$csystem" "$cext"; then
              csig="$(file_signature "$cp")"; ccache_key="$cp|$csig"
              [ "$USE_HASH_CACHE" -eq 1 ] && craw="${CACHE_SHA[$ccache_key]:-}"
              [ -z "$craw" ] && [ "$USE_HASH_CACHE" -eq 0 ] && craw="${PREHASH_SHA_BY_PATH[$cp]:-}"
              [ -z "$craw" ] && craw="$(hash_file "$cp")"
              if [ -n "$craw" ] && [ "$craw" != "UNAVAILABLE" ]; then
                COLLISION_SHA_BY_PATH["$cp"]="$craw"; chkey="$(normalized_dat_hash "$cp" "$cext" "${craw,,}")"
                if [ -n "${DAT_NAME_BY_SHA[$chkey]+x}" ]; then
                  cdat_name="${DAT_NAME_BY_SHA[$chkey]}"; cdat_rom="${DAT_ROM_BY_SHA[$chkey]}"; cmeta_region="${DAT_REGION_BY_SHA[$chkey]:-}"; cmeta_release="${DAT_RELEASE_BY_SHA[$chkey]:-}"
                  if [ -n "$cdat_rom" ]; then cfinal="${cdat_rom##*/}"
                  else cclean_final="$(clean_title "$cdat_name")"; [ -n "$cmeta_region" ] && cregion="$cmeta_region"; [ -n "$cmeta_release" ] && ckind="$cmeta_release"; cfinal="$cclean_final$(suffix_for "$cregion" "$ckind").$cext"; fi
                  cauthoritative=1
                fi
              fi
            fi
            cfinal_key="${csystem,,}|${cfinal,,}"; ccompound="$cgroup|$cfinal_key"
            ccount="${COLLISION_FINAL_COUNTS["$ccompound"]:-0}"; ccount=$((ccount+1)); COLLISION_FINAL_COUNTS["$ccompound"]="$ccount"
            if [ "$cauthoritative" -eq 1 ]; then ccount="${COLLISION_GROUP_AUTH_COUNT["$cgroup"]:-0}"; ccount=$((ccount+1)); COLLISION_GROUP_AUTH_COUNT["$cgroup"]="$ccount"; fi
          done < "$PLAN"

          REPORT_START=$(date +%s)'''
          replace1('REPORT_START=$(date +%s)',pre)
          replace1('TOTAL=0; SAVE_MATCHES=0; COLLISIONS=0; HASHED=0; DAT_MATCHED=0; HASH_REUSED=0; HASH_CALCULATED=0; HASH_SKIPPED=0; HASH_ELIGIBLE=0','TOTAL=0; SAVE_MATCHES=0; COLLISIONS=0; RESOLVED_CANONICAL_VARIANTS=0; HASHED=0; DAT_MATCHED=0; HASH_REUSED=0; HASH_CALCULATED=0; HASH_SKIPPED=0; HASH_ELIGIBLE=0')
          replace1('declare -A SEEN_NAMES','declare -A BLOCKING_SEEN_NAMES')
          lines=t.splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=='suffix="$(suffix_for "$region" "$kind")"; base="$clean$suffix"; proposed="$base.$ext"' and i>400)
          end=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='row_seconds_start=$SECONDS')
          lines[start:end]=['  suffix="$(suffix_for "$region" "$kind")"; base="$clean$suffix"; proposed="$base.$ext"','  key="${system,,}|${proposed,,}"; collision="None"','  pre_collision_count="${NAME_COUNTS["$key"]:-0}"; collision_group="$key"','']
          t='\n'.join(lines)+'\n'
          replace1('      if [ "$USE_HASH_CACHE" -eq 0 ] && [ -n "${PREHASH_SHA_BY_PATH[$p]:-}" ]; then sha1="${PREHASH_SHA_BY_PATH[$p]}"; else sha1="$(hash_file "$p")"; fi','      if [ -n "${COLLISION_SHA_BY_PATH[$p]:-}" ]; then sha1="${COLLISION_SHA_BY_PATH[$p]}"; elif [ "$USE_HASH_CACHE" -eq 0 ] && [ -n "${PREHASH_SHA_BY_PATH[$p]:-}" ]; then sha1="${PREHASH_SHA_BY_PATH[$p]}"; else sha1="$(hash_file "$p")"; fi')
          lines=t.splitlines(); start=next(i for i,l in enumerate(lines) if 'Do not perform arithmetic on filename-derived associative-array' in l); end=next(i for i in range(start,len(lines)) if lines[i].strip()=='save_count=0; save_key="${stem,,}"')
          block=['  # Classify collision safety after DAT identity finalizes the target.','  if [ "$pre_collision_count" -gt 1 ] 2>/dev/null; then','    final_key="${system,,}|${proposed,,}"; compound_key="$collision_group|$final_key"','    auth_count="${COLLISION_GROUP_AUTH_COUNT["$collision_group"]:-0}"; final_count="${COLLISION_FINAL_COUNTS["$compound_key"]:-0}"','    if [ "$auth_count" -eq "$pre_collision_count" ] 2>/dev/null && [ "$final_count" -eq 1 ] 2>/dev/null; then','      collision="Resolved canonical DAT variant"; RESOLVED_CANONICAL_VARIANTS=$((RESOLVED_CANONICAL_VARIANTS+1))','    else','      collision="BLOCKING collision"; COLLISIONS=$((COLLISIONS+1))','      if [ "$final_count" -gt 1 ] 2>/dev/null; then','        n="${BLOCKING_SEEN_NAMES["$final_key"]:-0}"; n=$((n+1)); BLOCKING_SEEN_NAMES["$final_key"]="$n"','        final_base="${proposed%.*}"; final_ext="${proposed##*.}"; proposed="$final_base [Variant $n].$final_ext"','        collision="BLOCKING collision - variant $n of $final_count"','      fi','    fi','  fi','',lines[end]]
          lines[start:end+1]=block; t='\n'.join(lines)+'\n'
          replace1('Collision-affected rows made unique: $COLLISIONS','Blocking collision rows: $COLLISIONS\nResolved canonical DAT variant rows: $RESOLVED_CANONICAL_VARIANTS')
          replace1('  echo "Collision-affected rows: $COLLISIONS"','  echo "Blocking collision rows: $COLLISIONS"\n  echo "Resolved canonical DAT variant rows: $RESOLVED_CANONICAL_VARIANTS"')
          replace1('echo " Collisions        : $COLLISIONS"','echo " Blocking collisions: $COLLISIONS"\necho " DAT variants safe : $RESOLVED_CANONICAL_VARIANTS"')
          p.write_text(t)

          b=Path('tests/build_synthetic_library.py'); x=b.read_text(); m='    # The bulk profile uses an intentionally unsupported hash extension that is\n'; assert x.count(m)==1
          x=x.replace(m,'    # Issue #7: same fallback, distinct authoritative canonical targets.\n    (special / "Canonical Variant (USA) (Rev 1).sfc").write_bytes(b"issue7-rev1\\n")\n    (special / "Canonical Variant (USA) (Rev 2).sfc").write_bytes(b"issue7-rev2\\n")\n    created += 2\n\n    # Issue #7: unsupported ambiguous pair remains blocking.\n    ambiguous = games / "GameGear"\n    ambiguous.mkdir(parents=True, exist_ok=True)\n    (ambiguous / "Ambiguous Collision (USA) (Rev 1).gg").write_bytes(b"ambiguous-1\\n")\n    (ambiguous / "Ambiguous Collision (USA) (Rev 2).gg").write_bytes(b"ambiguous-2\\n")\n    created += 2\n\n'+m,1); b.write_text(x)

          q=Path('tests/test_exporter_synthetic.sh'); x=q.read_text(); m='python3 - "$TEST_BIN/Export_Game_Library.sh" "$ROOT" <<\'PY\'\n'; assert x.count(m)==1
          x=x.replace(m,r'''# Issue #7 authoritative revision pair.
          for rev in 1 2; do
            vp="$ROOT/games/SNES/Canonical Variant (USA) (Rev $rev).sfc"; vh=$(sha1sum "$vp" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$vh" "Canonical Variant (USA) (Rev $rev)" "Canonical Variant (USA) (Rev $rev).sfc" "Synthetic Issue #7" "12" "00000000" "00000000000000000000000000000000" "SNES" "SNES" "SNES" "USA" "Revision" "Licensed" >> "$TEST_BIN/mister_hash_database.tsv"
          done

          '''+m,1)
          x=x.replace('verdict=$(value_after_colon "Audit integrity verdict")\n','verdict=$(value_after_colon "Audit integrity verdict")\nblocking=$(value_after_colon "Blocking collision rows")\nresolved=$(value_after_colon "Resolved canonical DAT variant rows")\n',1)
          x=x.replace('[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n','[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n[ "$resolved" -eq 2 ] || fail "resolved=$resolved expected=2"\n[ "$blocking" -eq 4 ] || fail "blocking=$blocking expected=4"\n',1)
          x=x.replace('echo "Synthetic Full Verification regression test passed."','grep -F \'Canonical Variant\' "$CATALOG" | grep -Fq \'Resolved canonical DAT variant\' || fail "canonical variants not resolved"\ngrep -F \'Ambiguous Collision\' "$CATALOG" | grep -Fq \'BLOCKING collision\' || fail "ambiguous pair not blocking"\n\necho "Synthetic Full Verification regression test passed."',1); q.write_text(x)

          Path('README.md').write_text(Path('README.md').read_text()+'\n\n### Issue #7 final-target collision classification\n\nv1.3 evaluates collision safety after DAT identity finalizes each proposed filename. Pre-DAT collisions are non-blocking only when every row has authoritative DAT identity and every final canonical target is unique. Identical targets, hash duplicates, unmatched/unsupported rows, and mixed or ambiguous groups remain blocking. Only blocking collisions produce `collision-review-required` and `DO NOT APPLY`.\n')
          Path('PROJECT_CONTEXT.md').write_text(Path('PROJECT_CONTEXT.md').read_text()+'\n\n## Issue #7 final-target collision safety\n\nCollision safety is evaluated against final post-DAT targets. All-DAT groups with unique canonical targets are reported separately as resolved; identical targets, hash duplicates, unmatched/unsupported files, and mixed/ambiguous groups remain blocking. Preserve Issue #6 apostrophe safety by doing arithmetic only on scalar counters.\n')
          Path('wiki/Audit-Safety.md').write_text(Path('wiki/Audit-Safety.md').read_text()+'\n\n## Final-target collision classification\n\nA pre-DAT collision is `Resolved canonical DAT variant` only when every member has authoritative DAT identity and each final canonical target is unique. Identical targets, hash duplicates, unmatched/unsupported files, and mixed/ambiguous groups are `BLOCKING collision`; only blocking rows trigger `collision-review-required` and `DO NOT APPLY`.\n')
          PY
      - name: Validate
        run: |
          set -euo pipefail
          bash -n Export_Game_Library.sh
          CI=true bash tests/test_exporter_synthetic.sh
      - name: Build Downloader db
        run: |
          set -euo pipefail
          mkdir -p /tmp/db /tmp/dl; CSV=/tmp/db/files.csv; RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"
          add(){ printf '%s,%s/%s,%s,%s,%s\n' "$2" "$RAW" "$1" "$(stat -c '%s' "$1")" "$(md5sum "$1"|awk '{print $1}')" mister-rom-library-auditor >> "$CSV"; }
          add Export_Game_Library.sh Scripts/Export_Game_Library.sh; add Update_Game_Library.sh Scripts/Update_Game_Library.sh; add mister_hash_database.tsv Scripts/mister_hash_database.tsv
          curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py -o /tmp/db/op.py
          DB_ID="jrampey/MiSTer-ROM-Library-Auditor" DB_URL="$RAW/db.json" BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" EXTERNAL_FILES="$CSV" FINDER_IGNORE="Export_Game_Library.sh Update_Game_Library.sh mister_hash_database.tsv README.md PROJECT_CONTEXT.md wiki" DB_JSON_NAME=db.json python3 /tmp/db/op.py build .
          curl -fsSL https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py -o /tmp/dl/test.py; chmod +x /tmp/dl/test.py; (cd /tmp/dl && ./test.py jrampey/MiSTer-ROM-Library-Auditor "$GITHUB_WORKSPACE/db.json")
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-issue-7.yml .github/workflows/apply-issue-7-v2.yml .github/workflows/apply-issue-7-v3.yml
          git add Export_Game_Library.sh tests/build_synthetic_library.py tests/test_exporter_synthetic.sh README.md PROJECT_CONTEXT.md wiki/Audit-Safety.md db.json
          git commit -m "Fix final-target collision classification for Issue #7"
          git push
