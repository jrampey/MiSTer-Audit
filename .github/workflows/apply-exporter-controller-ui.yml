name: Apply exporter controller UI

on:
  push:
    paths:
      - .github/workflows/apply-exporter-controller-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply controller-first selector
        run: python3 tools/apply_exporter_ui_once.py
      - name: Validate exporter
        run: bash -n Export_Game_Library.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-exporter-controller-ui.yml tools/apply_exporter_ui_once.py
          git add Export_Game_Library.sh README.md PROJECT_CONTEXT.md wiki/Audit-Workflow.md
          git commit -m "Improve controller-first exporter UI"
          git push
