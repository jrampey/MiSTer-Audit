name: Apply ASCII exporter UI cleanup

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_ascii_ui_cleanup.py'
      - '.github/workflows/apply-ascii-ui-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exporter UI
        run: python3 tools/apply_ascii_ui_cleanup.py
      - name: Validate shell syntax and ASCII source
        run: |
          bash -n Export_Game_Library.sh
          LC_ALL=C grep -n '[^ -~[:space:]]' Export_Game_Library.sh && exit 1 || true
      - name: Commit exporter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Export_Game_Library.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No exporter changes required."
            exit 0
          fi
          git commit -m "Clean up exporter ASCII UI"
          git push
