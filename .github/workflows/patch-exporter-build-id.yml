name: Patch Exporter Build ID

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-exporter-build-id.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exporter directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Export_Game_Library.sh')
          s = p.read_text()
          if 'EXPORTER_BUILD_ID=' in s:
              raise SystemExit('Build ID already present')
          marker = 'METADATA_LAYER_STATUS="${METADATA_LAYER_STATUS:-Unknown}"; EXPORTER_BUILD_SHA1="$(hash_file "$0")"\n'
          if marker not in s:
              raise SystemExit('Startup marker not found')
          block = marker + '''exporter_build_id() {
  local p="$1" digest="" rest=""
  if command -v md5sum >/dev/null 2>&1; then
    read -r digest rest < <(md5sum "$p" 2>/dev/null)
  elif command -v openssl >/dev/null 2>&1; then
    digest="$(openssl md5 "$p" 2>/dev/null)"
    digest="${digest##* }"
  else
    digest="$EXPORTER_BUILD_SHA1"
  fi
  printf '%.8s' "$digest"
}
EXPORTER_BUILD_ID="$(exporter_build_id "$0")"
'''
          s = s.replace(marker, block, 1)
          banner = 'echo "+--------------------------------------------------+"; echo "| MiSTer ROM Library Auditor v1.4                 |"; echo "| Read-only audit - no ROMs or saves are changed  |"; echo "+--------------------------------------------------+"; echo\n'
          replacement = 'echo "+--------------------------------------------------+"; echo "| MiSTer ROM Library Auditor v1.4                 |"; printf "| Build: %-41s|\\n" "$EXPORTER_BUILD_ID"; echo "| Read-only audit - no ROMs or saves are changed  |"; echo "+--------------------------------------------------+"; echo\n'
          if banner not in s:
              raise SystemExit('Startup banner not found')
          p.write_text(s.replace(banner, replacement, 1))
          PY
          bash -n Export_Game_Library.sh
          grep -F 'EXPORTER_BUILD_ID="$(exporter_build_id "$0")"' Export_Game_Library.sh
          grep -F 'Build: %-41s' Export_Game_Library.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Export_Game_Library.sh
          git commit -m "Show exporter runtime build ID"
          git push
