name: Apply exporter performance pass 2
on:
  push:
    paths:
      - '.github/workflows/apply-exporter-perf2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply performance changes
        run: python3 .github/scripts/apply-exporter-perf2.py
      - name: Validate syntax and regression suite
        run: |
          bash -n Export_Game_Library.sh
          bash tests/test_exporter_synthetic.sh
      - name: Commit optimized exporter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Export_Game_Library.sh
          git commit -m 'Optimize exporter cache and database hot paths'
          git push
# rerun corrected migration
