name: Apply library completion feature

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_completion_feature.py'
      - '.github/workflows/apply-library-completion-feature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exporter
        run: python3 tools/apply_completion_feature.py
      - name: Validate exporter syntax
        run: bash -n Export_Game_Library.sh
      - name: Commit exporter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Export_Game_Library.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No exporter changes required."
            exit 0
          fi
          git commit -m "Add configurable regional library completion"
          git push
