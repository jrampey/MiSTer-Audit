name: Apply MegaDrive DAT cache fix

on:
  push:
    paths:
      - '.github/workflows/apply-megadrive-dat-cache-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exporter DAT cache identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('Export_Game_Library.sh')
          s = p.read_text()
          old = 'HASH_DB_SOURCE="mister_hash_database.tsv"; HASH_DB_FINGERPRINT="$(file_signature "$HASH_DB_TSV")"'
          new = 'HASH_DB_SOURCE="mister_hash_database.tsv"; HASH_DB_FINGERPRINT="$(hash_file "$HASH_DB_TSV")"'
          if old not in s:
              raise SystemExit('Expected HASH_DB_FINGERPRINT line not found')
          s = s.replace(old, new, 1)
          old = "megadrive|mega\\ drive|genesis) printf 'Genesis' ;;"
          new = "megadrive|mega\\ drive|genesis) printf 'MegaDrive' ;;"
          if old not in s:
              raise SystemExit('Expected MegaDrive canonicalization line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate patch
        run: |
          bash -n Export_Game_Library.sh
          grep -F 'HASH_DB_FINGERPRINT="$(hash_file "$HASH_DB_TSV")"' Export_Game_Library.sh
          grep -F "megadrive|mega\\ drive|genesis) printf 'MegaDrive' ;;" Export_Game_Library.sh
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Export_Game_Library.sh
          git commit -m 'Fix MegaDrive DAT cache matching'
          git push
