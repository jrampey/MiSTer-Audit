# MiSTer ROM Library Auditor policy
# User-facing policy only. Runtime implementation and cache settings do not belong here.
# v1.3 defaults remain unchanged.

# Comma-separated canonical completion regions.
COMPLETION_REGIONS=USA

# Include canonical World releases in completion when compatible with selected regions.
COMPLETION_INCLUDE_WORLD=1

# Restrict completion denominator to retail releases.
COMPLETION_RETAIL_ONLY=1

# Future release-policy switches. Kept explicit so policy is data, not filename heuristics.
COMPLETION_INCLUDE_PROTOTYPES=0
COMPLETION_INCLUDE_BETA=0
COMPLETION_INCLUDE_DEMOS=0
