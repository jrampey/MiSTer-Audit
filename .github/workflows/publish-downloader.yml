name: Publish MiSTer Downloader Database
# Unified runtime: MiSTer_Audit.sh
# Republish trigger: warning menu update
on:
  workflow_call:
    inputs:
      ref:
        description: Commit/ref containing distributed files
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/ref containing distributed files
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: publish-downloader-db
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Validate distributed files
        run: |
          set -euo pipefail
          bash -n MiSTer_Audit.sh
          python3 tools/validate_hash_database.py mister_hash_database.tsv
          bash tests/test_exporter_synthetic.sh
      - name: Build manifest
        run: |
          set -euo pipefail
          PUBLISH_SHA=$(git rev-parse HEAD)
          BUILD_DIR="$GITHUB_WORKSPACE/.downloader-build"
          STAGE_DIR="$BUILD_DIR/stage"
          CSV="$BUILD_DIR/external_files.csv"
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PUBLISH_SHA}"
          rm -rf "$BUILD_DIR"; mkdir -p "$STAGE_DIR"
          printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"
          add_file() { printf '%s,%s/%s,%s,%s,%s\n' "$2" "$RAW_BASE" "$1" "$(stat -c '%s' "$1")" "$(md5sum "$1"|awk '{print $1}')" mister-rom-library-auditor >> "$CSV"; }
          add_file MiSTer_Audit.sh Scripts/MiSTer_Audit.sh
          add_file mister_hash_database.tsv Scripts/mister_hash_database.tsv
          curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py -o "$BUILD_DIR/db_operator.py"
          DB_ID="jrampey/MiSTer-ROM-Library-Auditor" DB_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/db.json" BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" EXTERNAL_FILES="$CSV" DB_JSON_NAME=db.json python3 "$BUILD_DIR/db_operator.py" build "$STAGE_DIR"
          cp "$STAGE_DIR/db.json" "$GITHUB_WORKSPACE/db.json"
          rm -rf "$BUILD_DIR"
          PUBLISH_SHA="$PUBLISH_SHA" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          db=json.loads(Path('db.json').read_text()); sha=os.environ['PUBLISH_SHA']
          expected={'Scripts/MiSTer_Audit.sh':'MiSTer_Audit.sh','Scripts/mister_hash_database.tsv':'mister_hash_database.tsv'}
          for target,source in expected.items():
              data=Path(source).read_bytes(); e=db['files'][target]
              assert e['size']==len(data) and e['hash']==hashlib.md5(data).hexdigest(), target
              assert f'/{sha}/' in e['url'], target
          assert db['base_files_url']==f'https://raw.githubusercontent.com/{os.environ["GITHUB_REPOSITORY"]}/{sha}/'
          PY
      - name: Validate with MiSTer Downloader
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloader-test"
          curl -fsSL https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py -o "$RUNNER_TEMP/downloader-test/downloader_test.py"
          chmod +x "$RUNNER_TEMP/downloader-test/downloader_test.py"
          cd "$RUNNER_TEMP/downloader-test"
          ./downloader_test.py jrampey/MiSTer-ROM-Library-Auditor "$GITHUB_WORKSPACE/db.json"
      - name: Publish db.json
        run: |
          set -euo pipefail
          cp db.json "$RUNNER_TEMP/db.json"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/db.json" db.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add db.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update MiSTer Downloader database'
          git push origin main
