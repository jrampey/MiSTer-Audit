name: Apply Issue 7 canonical collision fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-issue-7.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exporter, regression tests, and docs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one patch anchor, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          exporter = "Export_Game_Library.sh"
          anchor = '''REPORT_START=$(date +%s)'''
          prepass = r'''# Resolve pre-DAT filename collisions against authoritative final DAT targets.
          # Only groups where every row has DAT identity and every final canonical target
          # is unique are non-blocking. Ambiguous, unmatched, unsupported, duplicate-hash,
          # or identical-target groups remain blocking for Apply.
          declare -A COLLISION_GROUP_AUTH_COUNT COLLISION_FINAL_COUNTS COLLISION_SHA_BY_PATH COLLISION_HKEY_BY_PATH
          while IFS=$'\t' read -r csystem cp cfile cext cstem cclean cregion ckind; do
            [ -z "$cp" ] && continue
            csuffix="$(suffix_for "$cregion" "$ckind")"; cfallback="$cclean$csuffix.$cext"
            cgroup="${csystem,,}|${cfallback,,}"
            cgroup_count="${NAME_COUNTS["$cgroup"]:-0}"
            [ "$cgroup_count" -gt 1 ] 2>/dev/null || continue
            cfinal="$cfallback"; cauthoritative=0; craw=""; chkey=""
            if should_hash "$csystem" "$cext"; then
              csig="$(file_signature "$cp")"; ccache_key="$cp|$csig"
              if [ "$USE_HASH_CACHE" -eq 1 ]; then craw="${CACHE_SHA[$ccache_key]:-}"; fi
              if [ -z "$craw" ] && [ "$USE_HASH_CACHE" -eq 0 ]; then craw="${PREHASH_SHA_BY_PATH[$cp]:-}"; fi
              [ -z "$craw" ] && craw="$(hash_file "$cp")"
              if [ -n "$craw" ] && [ "$craw" != "UNAVAILABLE" ]; then
                COLLISION_SHA_BY_PATH["$cp"]="$craw"
                chkey="$(normalized_dat_hash "$cp" "$cext" "${craw,,}")"
                COLLISION_HKEY_BY_PATH["$cp"]="$chkey"
                if [ -n "${DAT_NAME_BY_SHA[$chkey]+x}" ]; then
                  cdat_name="${DAT_NAME_BY_SHA[$chkey]}"; cdat_rom="${DAT_ROM_BY_SHA[$chkey]}"
                  cmeta_region="${DAT_REGION_BY_SHA[$chkey]:-}"; cmeta_release="${DAT_RELEASE_BY_SHA[$chkey]:-}"
                  if [ -n "$cdat_rom" ]; then
                    cfinal="${cdat_rom##*/}"
                  else
                    cclean_final="$(clean_title "$cdat_name")"
                    [ -n "$cmeta_region" ] && cregion="$cmeta_region"
                    [ -n "$cmeta_release" ] && ckind="$cmeta_release"
                    cfinal="$cclean_final$(suffix_for "$cregion" "$ckind").$cext"
                  fi
                  cauthoritative=1
                fi
              fi
            fi
            cfinal_key="${csystem,,}|${cfinal,,}"
            ccompound="$cgroup|$cfinal_key"
            ccount="${COLLISION_FINAL_COUNTS["$ccompound"]:-0}"; ccount=$((ccount+1)); COLLISION_FINAL_COUNTS["$ccompound"]="$ccount"
            if [ "$cauthoritative" -eq 1 ]; then
              ccount="${COLLISION_GROUP_AUTH_COUNT["$cgroup"]:-0}"; ccount=$((ccount+1)); COLLISION_GROUP_AUTH_COUNT["$cgroup"]="$ccount"
            fi
          done < "$PLAN"

          REPORT_START=$(date +%s)'''
          replace_once(exporter, anchor, prepass)
          replace_once(exporter, 'TOTAL=0; SAVE_MATCHES=0; COLLISIONS=0; HASHED=0; DAT_MATCHED=0; HASH_REUSED=0; HASH_CALCULATED=0; HASH_SKIPPED=0; HASH_ELIGIBLE=0', 'TOTAL=0; SAVE_MATCHES=0; COLLISIONS=0; RESOLVED_CANONICAL_VARIANTS=0; HASHED=0; DAT_MATCHED=0; HASH_REUSED=0; HASH_CALCULATED=0; HASH_SKIPPED=0; HASH_ELIGIBLE=0')
          replace_once(exporter, 'declare -A SEEN_NAMES', 'declare -A BLOCKING_SEEN_NAMES')
          old = r'''  suffix="$(suffix_for "$region" "$kind")"; base="$clean$suffix"; proposed="$base.$ext"
            key="${system,,}|${proposed,,}"; collision="None"
            if [ "${NAME_COUNTS["$key"]:-0}" -gt 1 ]; then
              # Keep every proposal unique without discarding source metadata.
              n=$(( ${SEEN_NAMES["$key"]:-0} + 1 )); SEEN_NAMES["$key"]=$n
              proposed="$base [Variant $n].$ext"; collision="Resolved variant $n of ${NAME_COUNTS["$key"]}"
              COLLISIONS=$((COLLISIONS+1))
            fi'''
          new = r'''  suffix="$(suffix_for "$region" "$kind")"; base="$clean$suffix"; proposed="$base.$ext"
            key="${system,,}|${proposed,,}"; collision="None"
            pre_collision_count="${NAME_COUNTS["$key"]:-0}"; collision_group="$key"'''
          replace_once(exporter, old, new)
          replace_once(exporter, '      if [ "$USE_HASH_CACHE" -eq 0 ] && [ -n "${PREHASH_SHA_BY_PATH[$p]:-}" ]; then sha1="${PREHASH_SHA_BY_PATH[$p]}"; else sha1="$(hash_file "$p")"; fi', '      if [ -n "${COLLISION_SHA_BY_PATH[$p]:-}" ]; then sha1="${COLLISION_SHA_BY_PATH[$p]}"; elif [ "$USE_HASH_CACHE" -eq 0 ] && [ -n "${PREHASH_SHA_BY_PATH[$p]:-}" ]; then sha1="${PREHASH_SHA_BY_PATH[$p]}"; else sha1="$(hash_file "$p")"; fi')
          anchor = r'''  # Do not perform arithmetic on filename-derived associative-array
            # subscripts here. Canonical duplicate safety is enforced later by the
            # updater's preview/apply validation; the exporter only records proposals.

            save_count=0; save_key="${stem,,}"'''
          replacement = r'''  # Classify collision safety only after DAT identity has finalized the target.
            # Arithmetic is performed on scalar counters, never filename-derived array
            # subscripts (Issue #6 regression).
            if [ "$pre_collision_count" -gt 1 ] 2>/dev/null; then
              final_key="${system,,}|${proposed,,}"; compound_key="$collision_group|$final_key"
              auth_count="${COLLISION_GROUP_AUTH_COUNT["$collision_group"]:-0}"
              final_count="${COLLISION_FINAL_COUNTS["$compound_key"]:-0}"
              if [ "$auth_count" -eq "$pre_collision_count" ] 2>/dev/null && [ "$final_count" -eq 1 ] 2>/dev/null; then
                collision="Resolved canonical DAT variant"
                RESOLVED_CANONICAL_VARIANTS=$((RESOLVED_CANONICAL_VARIANTS+1))
              else
                collision="BLOCKING collision"
                COLLISIONS=$((COLLISIONS+1))
                if [ "$final_count" -gt 1 ] 2>/dev/null; then
                  n="${BLOCKING_SEEN_NAMES["$final_key"]:-0}"; n=$((n+1)); BLOCKING_SEEN_NAMES["$final_key"]="$n"
                  final_base="${proposed%.*}"; final_ext="${proposed##*.}"
                  proposed="$final_base [Variant $n].$final_ext"
                  collision="BLOCKING collision - variant $n of $final_count"
                fi
              fi
            fi

            save_count=0; save_key="${stem,,}"'''
          replace_once(exporter, anchor, replacement)
          replace_once(exporter, 'Collision-affected rows made unique: $COLLISIONS', 'Blocking collision rows: $COLLISIONS\nResolved canonical DAT variant rows: $RESOLVED_CANONICAL_VARIANTS')
          replace_once(exporter, '  echo "Collision-affected rows: $COLLISIONS"', '  echo "Blocking collision rows: $COLLISIONS"\n  echo "Resolved canonical DAT variant rows: $RESOLVED_CANONICAL_VARIANTS"')
          replace_once(exporter, 'echo " Collisions        : $COLLISIONS"', 'echo " Blocking collisions: $COLLISIONS"\necho " DAT variants safe : $RESOLVED_CANONICAL_VARIANTS"')

          builder = Path('tests/build_synthetic_library.py')
          text = builder.read_text(); marker = '    # The bulk profile uses an intentionally unsupported hash extension that is\n'
          addition = '''    # Issue #7: distinct authoritative revisions with the same fallback title.\n    (special / "Canonical Variant (USA) (Rev 1).sfc").write_bytes(b"issue7 canonical variant rev1\\n")\n    (special / "Canonical Variant (USA) (Rev 2).sfc").write_bytes(b"issue7 canonical variant rev2\\n")\n    created += 2\n\n    # Issue #7: unsupported rows with the same fallback target remain blocking.\n    ambiguous = games / "GameGear"\n    ambiguous.mkdir(parents=True, exist_ok=True)\n    (ambiguous / "Ambiguous Collision (USA) (Rev 1).gg").write_bytes(b"ambiguous-one\\n")\n    (ambiguous / "Ambiguous Collision (USA) (Rev 2).gg").write_bytes(b"ambiguous-two\\n")\n    created += 2\n\n'''
          if text.count(marker) != 1: raise SystemExit('builder anchor mismatch')
          builder.write_text(text.replace(marker, addition + marker, 1))

          test = Path('tests/test_exporter_synthetic.sh'); text = test.read_text()
          marker = '''python3 - "$TEST_BIN/Export_Game_Library.sh" "$ROOT" <<'PY'\n'''
          dat_add = r'''# Issue #7: distinct authoritative canonical revisions whose fallback names collide.
          for rev in 1 2; do
            variant_path="$ROOT/games/SNES/Canonical Variant (USA) (Rev $rev).sfc"
            variant_sha=$(sha1sum "$variant_path" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$variant_sha" "Canonical Variant (USA) (Rev $rev)" "Canonical Variant (USA) (Rev $rev).sfc" \
              "Synthetic Issue #7 regression" "29" "00000000" "00000000000000000000000000000000" \
              "SNES" "SNES" "SNES" "USA" "Revision" "Licensed" >> "$TEST_BIN/mister_hash_database.tsv"
          done

          '''
          if text.count(marker) != 1: raise SystemExit('test DAT anchor mismatch')
          text = text.replace(marker, dat_add + marker, 1)
          marker2 = 'verdict=$(value_after_colon "Audit integrity verdict")\n'
          if text.count(marker2) != 1: raise SystemExit('test summary anchor mismatch')
          text = text.replace(marker2, marker2 + 'blocking=$(value_after_colon "Blocking collision rows")\nresolved=$(value_after_colon "Resolved canonical DAT variant rows")\n', 1)
          marker3 = '[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n'
          if text.count(marker3) != 1: raise SystemExit('test assertion anchor mismatch')
          text = text.replace(marker3, marker3 + '[ "$resolved" -eq 2 ] || fail "resolved canonical DAT variant rows=$resolved expected=2"\n[ "$blocking" -eq 4 ] || fail "blocking collision rows=$blocking expected=4"\n', 1)
          marker4 = 'grep -Fq \'Synthetic GameGear 05746\' "$CATALOG" || fail "tail sentinel missing"\n'
          checks = 'grep -Fq \'Canonical Variant (USA) (Rev 1).sfc\' "$CATALOG" || fail "canonical variant rev1 missing"\ngrep -Fq \'Canonical Variant (USA) (Rev 2).sfc\' "$CATALOG" || fail "canonical variant rev2 missing"\ngrep -F \'Canonical Variant\' "$CATALOG" | grep -Fq \'Resolved canonical DAT variant\' || fail "canonical DAT variants were not marked resolved"\ngrep -F \'Ambiguous Collision\' "$CATALOG" | grep -Fq \'BLOCKING collision\' || fail "unsupported ambiguous collision was not blocking"\n'
          if text.count(marker4) != 1: raise SystemExit('test sentinel anchor mismatch')
          test.write_text(text.replace(marker4, marker4 + checks, 1))

          Path('README.md').write_text(Path('README.md').read_text() + '''\n\n### Issue #7 final-target collision classification\n\nv1.3 now evaluates rename collision safety after authoritative DAT identity has finalized each proposed filename. A pre-DAT filename collision is non-blocking only when every row in the group has authoritative DAT identity and every final canonical target is unique. Identical canonical targets, hash duplicates, unmatched/unsupported rows, and mixed or ambiguous groups remain blocking. Reports distinguish `Resolved canonical DAT variant` rows from `BLOCKING collision` rows; only blocking collisions produce `collision-review-required` and `DO NOT APPLY`.\n''')
          Path('PROJECT_CONTEXT.md').write_text(Path('PROJECT_CONTEXT.md').read_text() + '''\n\n## Issue #7 final-target collision safety\n\nCollision safety is evaluated against final post-DAT rename targets. Pre-DAT fallback collisions are automatically resolved only when all rows have authoritative DAT identities and their canonical targets are unique within the system/destination scope. Identical targets, hash duplicates, unmatched or unsupported files, and mixed/ambiguous groups remain blocking. `COLLISIONS` now counts only blocking rows; `RESOLVED_CANONICAL_VARIANTS` is reported separately. Only blocking collisions add `collision-review-required` and force `DO NOT APPLY`. Keep the Issue #6 apostrophe-safe scalar-counter pattern: never perform arithmetic directly through filename-derived associative-array subscripts.\n''')
          Path('wiki/Audit-Safety.md').write_text(Path('wiki/Audit-Safety.md').read_text() + '''\n\n## Final-target collision classification\n\nThe auditor distinguishes filename-parser collisions from true final-target collisions. After SHA-1/DAT identification, a group is marked `Resolved canonical DAT variant` only when every member has authoritative DAT identity and each final canonical target is unique. Those rows do not block Apply. Identical canonical targets, hash duplicates, unmatched/unsupported files, or mixed/ambiguous groups are marked `BLOCKING collision`; only these rows contribute to `collision-review-required` and `DO NOT APPLY`. Duplicate final targets receive deterministic `[Variant N]` proposal names for review and are never treated as automatically safe.\n''')
          PY

      - name: Validate exporter and synthetic regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n Export_Game_Library.sh
          CI=true bash tests/test_exporter_synthetic.sh

      - name: Rebuild and validate Downloader database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mister-db-build /tmp/downloader-test
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"; CSV="/tmp/mister-db-build/external_files.csv"
          printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"
          add_file() { local source="$1" target="$2" size md5; size=$(stat -c '%s' "$source"); md5=$(md5sum "$source" | awk '{print $1}'); printf '%s,%s/%s,%s,%s,%s\n' "$target" "$RAW_BASE" "$source" "$size" "$md5" "mister-rom-library-auditor" >> "$CSV"; }
          add_file "Export_Game_Library.sh" "Scripts/Export_Game_Library.sh"; add_file "Update_Game_Library.sh" "Scripts/Update_Game_Library.sh"; add_file "mister_hash_database.tsv" "Scripts/mister_hash_database.tsv"
          curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py -o /tmp/mister-db-build/db_operator.py
          DB_ID="jrampey/MiSTer-ROM-Library-Auditor" DB_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/db.json" BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" EXTERNAL_FILES="$CSV" FINDER_IGNORE="Export_Game_Library.sh Update_Game_Library.sh mister_hash_database.tsv README.md PROJECT_CONTEXT.md wiki" DB_JSON_NAME="db.json" python3 /tmp/mister-db-build/db_operator.py build .
          curl -fsSL https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py -o /tmp/downloader-test/downloader_test.py
          chmod +x /tmp/downloader-test/downloader_test.py
          (cd /tmp/downloader-test && ./downloader_test.py "jrampey/MiSTer-ROM-Library-Auditor" "$GITHUB_WORKSPACE/db.json")

      - name: Commit complete Issue 7 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-issue-7.yml
          git add Export_Game_Library.sh tests/build_synthetic_library.py tests/test_exporter_synthetic.sh README.md PROJECT_CONTEXT.md wiki/Audit-Safety.md db.json
          git commit -m "Fix final-target collision classification for Issue #7"
          git push
