name: Build MiSTer Downloader Database
# Automatically publish a validated MiSTer Downloader manifest whenever a distributed file changes.
# A workflow-file change also intentionally refreshes stale manifest metadata.

on:
  push:
    branches: [main]
    paths:
      - "Export_Game_Library.sh"
      - "Update_Game_Library.sh"
      - "mister_hash_database.tsv"
      - ".github/workflows/build-downloader-db.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-downloader-db
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pre-publish validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n Export_Game_Library.sh
          bash -n Update_Game_Library.sh
          python3 tools/validate_hash_database.py mister_hash_database.tsv
          bash tests/test_exporter_synthetic.sh

      - name: Build Downloader database
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/mister-db-build

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          CSV="/tmp/mister-db-build/external_files.csv"

          printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"

          add_file() {
            local source="$1"
            local target="$2"
            local size md5
            size=$(stat -c '%s' "$source")
            md5=$(md5sum "$source" | awk '{print $1}')
            printf '%s,%s/%s,%s,%s,%s\n' "$target" "$RAW_BASE" "$source" "$size" "$md5" "mister-rom-library-auditor" >> "$CSV"
          }

          add_file "Export_Game_Library.sh" "Scripts/Export_Game_Library.sh"
          add_file "Update_Game_Library.sh" "Scripts/Update_Game_Library.sh"
          add_file "mister_hash_database.tsv" "Scripts/mister_hash_database.tsv"

          curl -fsSL \
            https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py \
            -o /tmp/mister-db-build/db_operator.py

          cd "$GITHUB_WORKSPACE"

          DB_ID="jrampey/MiSTer-ROM-Library-Auditor" \
          DB_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/db.json" \
          BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" \
          EXTERNAL_FILES="$CSV" \
          FINDER_IGNORE="Export_Game_Library.sh Update_Game_Library.sh mister_hash_database.tsv README.md PROJECT_CONTEXT.md wiki" \
          DB_JSON_NAME="db.json" \
          python3 /tmp/mister-db-build/db_operator.py build .

      - name: Verify manifest matches distributed files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          db=json.loads(Path('db.json').read_text())
          expected={
              'Scripts/Export_Game_Library.sh':'Export_Game_Library.sh',
              'Scripts/Update_Game_Library.sh':'Update_Game_Library.sh',
              'Scripts/mister_hash_database.tsv':'mister_hash_database.tsv',
          }
          files=db.get('files',{})
          for target, source in expected.items():
              entry=files.get(target)
              if not entry:
                  raise SystemExit(f'Missing manifest entry: {target}')
              data=Path(source).read_bytes()
              size=len(data); md5=hashlib.md5(data).hexdigest()
              if entry.get('size') != size or entry.get('hash') != md5:
                  raise SystemExit(f'Manifest mismatch for {target}: expected size={size} md5={md5}, got {entry}')
          print('Manifest exactly matches all distributed files.')
          PY

      - name: Validate database with MiSTer Downloader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/downloader-test
          curl -fsSL \
            https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py \
            -o /tmp/downloader-test/downloader_test.py
          chmod +x /tmp/downloader-test/downloader_test.py
          cd /tmp/downloader-test
          ./downloader_test.py "jrampey/MiSTer-ROM-Library-Auditor" "$GITHUB_WORKSPACE/db.json"

      - name: Commit generated database
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.json

          if git diff --cached --quiet; then
            echo "Downloader database is already current."
            exit 0
          fi

          git commit -m "Update MiSTer Downloader database"
          git push
