name: Documentation Consistency

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require documentation with implementation changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
            fi
          fi

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf 'Changed files:\n%s\n' "$CHANGED"

          runtime_changed=false
          behavior_changed=false
          readme_changed=false
          context_changed=false
          wiki_changed=false

          while IFS= read -r file; do
            case "$file" in
              MiSTer_Audit.sh|src/audit.sh|src/update.sh|mister_hash_database.tsv) runtime_changed=true; behavior_changed=true ;;
              src/main.sh|tools/build_runtime.sh) runtime_changed=true ;;
              README.md) readme_changed=true ;;
              PROJECT_CONTEXT.md) context_changed=true ;;
              wiki/*.md) wiki_changed=true ;;
            esac
          done <<< "$CHANGED"

          if [[ "$runtime_changed" == true && "$behavior_changed" == true ]]; then
            missing=()
            [[ "$readme_changed" == true ]] || missing+=("README.md")
            [[ "$context_changed" == true ]] || missing+=("PROJECT_CONTEXT.md")
            [[ "$wiki_changed" == true ]] || missing+=("wiki/*.md")
            if (( ${#missing[@]} > 0 )); then
              echo "::error::Runtime behavior changed without updating all required documentation surfaces."
              printf 'Missing documentation update: %s\n' "${missing[@]}"
              exit 1
            fi
          fi

          echo "Checking documentation state invariants."
          ! grep -RFn --include='*.md' 'build-downloader-db.yml' README.md wiki/ || { echo "::error::Obsolete build-downloader-db.yml reference found."; exit 1; }
          ! grep -RFn --include='*.md' 'current release is **v1.2**' README.md PROJECT_CONTEXT.md wiki/ || { echo "::error::Stale v1.2 current-release reference found."; exit 1; }
          ! grep -RFn --include='*.md' 'auditor is **v1.2**' README.md PROJECT_CONTEXT.md wiki/ || { echo "::error::Stale v1.2 auditor reference found."; exit 1; }
          ! grep -RFn --include='*.md' 'currently labeled **v1.1**' README.md PROJECT_CONTEXT.md wiki/ || { echo "::error::Stale v1.1 updater reference found."; exit 1; }
          ! grep -RFn --include='*.md' 'three runtime files' README.md PROJECT_CONTEXT.md wiki/ || { echo "::error::Update All distributes two files, not three."; exit 1; }
          ! grep -RFn --include='*.md' 'MiSTer_Audit.sh` and `MiSTer_Audit.sh' README.md PROJECT_CONTEXT.md wiki/ || { echo "::error::Duplicate unified-runtime distribution reference found."; exit 1; }
          grep -Fq 'Current release: v1.4' README.md || { echo "::error::README current release is not v1.4."; exit 1; }
          grep -Fq 'current release is **v1.4**' PROJECT_CONTEXT.md || { echo "::error::PROJECT_CONTEXT current release is not v1.4."; exit 1; }
          grep -Fq 'current release is **v1.4**' wiki/Home.md || { echo "::error::Wiki Home current release is not v1.4."; exit 1; }
          echo "Documentation consistency check passed."
