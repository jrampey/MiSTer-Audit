name: Validate DAT runtime optimization
on:
  push:
    branches: [perf/dat-opt-final]
    paths:
      - '.github/workflows/apply-dat-runtime-opt.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply optimization
        run: python3 .github/scripts/apply-dat-runtime-opt.py
      - name: Syntax validation
        run: bash -n Export_Game_Library.sh
      - name: Synthetic regression suite
        run: bash tests/test_exporter_synthetic.sh
      - name: Assert optimization invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'declare -A ACTIVE_DAT_SYSTEMS DAT_RECORD_BY_SHA' Export_Game_Library.sh
          grep -q 'build_active_dat_systems; build_dat_index' Export_Game_Library.sh
          ! grep -q 'DAT_NAME_BY_SHA' Export_Game_Library.sh
          grep -q 'Hash records skipped for absent systems' Export_Game_Library.sh
          grep -q 'Export_Game_Library_v1.3.sh' Export_Game_Library.sh
      - name: Commit validated exporter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Export_Game_Library.sh
          git commit -m 'Optimize system-scoped DAT loading'
          git push
