name: Validate conservative incremental discovery
on:
  push:
    branches: [perf/incremental-discovery]
    paths: ['.github/workflows/apply-incremental-discovery.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply optimization
        run: python3 .github/scripts/apply-incremental-discovery.py
      - name: Syntax validation
        run: bash -n Export_Game_Library.sh
      - name: Synthetic regression suite
        run: bash tests/test_exporter_synthetic.sh
      - name: Validate discovery invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DISCOVERY_SNAPSHOT=' Export_Game_Library.sh
          grep -q 'load_discovery_snapshot' Export_Game_Library.sh
          grep -q 'build_discovery_snapshot' Export_Game_Library.sh
          grep -q 'DISCOVERY_UNCHANGED' Export_Game_Library.sh
          grep -q 'DISCOVERY_REMOVED' Export_Game_Library.sh
          grep -q 'Full Verification: incremental discovery state ignored' Export_Game_Library.sh
          grep -q 'Export_Game_Library_v1.3.sh' Export_Game_Library.sh
          grep -q 'FULL_VERIFY_WORKERS=2' Export_Game_Library.sh
          grep -q 'find "$GAMES" -type f' Export_Game_Library.sh
      - name: Commit validated exporter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Export_Game_Library.sh
          git commit -m 'Add conservative incremental discovery'
          git push
