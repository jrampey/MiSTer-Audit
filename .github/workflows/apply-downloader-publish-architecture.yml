name: Apply Downloader Publication Architecture
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-downloader-publish-architecture.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install durable publication architecture
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/publish-downloader.yml <<'YAML'
          name: Publish MiSTer Downloader Database
          on:
            workflow_call:
              inputs:
                ref:
                  description: Commit/ref containing the distributed files to publish
                  required: false
                  type: string
            workflow_dispatch:
              inputs:
                ref:
                  description: Commit/ref containing the distributed files to publish
                  required: false
                  type: string
          permissions:
            contents: write
          concurrency:
            group: publish-downloader-db
            cancel-in-progress: false
          jobs:
            publish:
              runs-on: ubuntu-latest
              steps:
                - name: Resolve source ref
                  id: source
                  shell: bash
                  run: echo "ref=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"
                - name: Check out source commit
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ steps.source.outputs.ref }}
                    fetch-depth: 0
                - name: Validate distributed files
                  shell: bash
                  run: |
                    set -euo pipefail
                    bash -n Export_Game_Library.sh
                    bash -n Update_Game_Library.sh
                    python3 tools/validate_hash_database.py mister_hash_database.tsv
                    bash tests/test_exporter_synthetic.sh
                - name: Build and validate manifest
                  shell: bash
                  run: |
                    set -euo pipefail
                    PUBLISH_SHA=$(git rev-parse HEAD)
                    BUILD_DIR="$RUNNER_TEMP/downloader-build"
                    STAGE_DIR="$BUILD_DIR/stage"
                    CSV="$BUILD_DIR/external_files.csv"
                    RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PUBLISH_SHA}"
                    rm -rf "$BUILD_DIR"; mkdir -p "$STAGE_DIR"
                    printf '%s\n' 'Path in MiSTer,URL,Size in bytes,MD5 Hash,Filter Terms' > "$CSV"
                    add_file() { local source="$1" target="$2"; printf '%s,%s/%s,%s,%s,%s\n' "$target" "$RAW_BASE" "$source" "$(stat -c '%s' "$source")" "$(md5sum "$source" | awk '{print $1}')" 'mister-rom-library-auditor' >> "$CSV"; }
                    add_file Export_Game_Library.sh Scripts/Export_Game_Library.sh
                    add_file Update_Game_Library.sh Scripts/Update_Game_Library.sh
                    add_file mister_hash_database.tsv Scripts/mister_hash_database.tsv
                    curl -fsSL https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/.github/db_operator.py -o "$BUILD_DIR/db_operator.py"
                    DB_ID="jrampey/MiSTer-ROM-Library-Auditor" DB_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/db.json" BASE_FILES_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/%s/" EXTERNAL_FILES="$CSV" DB_JSON_NAME=db.json python3 "$BUILD_DIR/db_operator.py" build "$STAGE_DIR"
                    cp "$STAGE_DIR/db.json" db.json
                    PUBLISH_SHA="$PUBLISH_SHA" python3 - <<'PY'
                    import hashlib,json,os
                    from pathlib import Path
                    db=json.loads(Path('db.json').read_text()); sha=os.environ['PUBLISH_SHA']
                    expected={'Scripts/Export_Game_Library.sh':'Export_Game_Library.sh','Scripts/Update_Game_Library.sh':'Update_Game_Library.sh','Scripts/mister_hash_database.tsv':'mister_hash_database.tsv'}
                    for target,source in expected.items():
                        data=Path(source).read_bytes(); e=db['files'][target]
                        assert e['size']==len(data) and e['hash']==hashlib.md5(data).hexdigest(), target
                        assert f'/{sha}/' in e['url'], target
                    assert db['base_files_url']==f'https://raw.githubusercontent.com/{os.environ["GITHUB_REPOSITORY"]}/{sha}/'
                    PY
                - name: Validate with MiSTer Downloader
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p "$RUNNER_TEMP/downloader-test"
                    curl -fsSL https://github.com/MiSTer-devel/Downloader_MiSTer/releases/download/latest/downloader_test.py -o "$RUNNER_TEMP/downloader-test/downloader_test.py"
                    chmod +x "$RUNNER_TEMP/downloader-test/downloader_test.py"
                    cd "$RUNNER_TEMP/downloader-test"
                    ./downloader_test.py jrampey/MiSTer-ROM-Library-Auditor "$GITHUB_WORKSPACE/db.json"
                - name: Publish db.json to main
                  shell: bash
                  run: |
                    set -euo pipefail
                    cp db.json "$RUNNER_TEMP/db.json"
                    git fetch origin main
                    git checkout -B main origin/main
                    cp "$RUNNER_TEMP/db.json" db.json
                    git config user.name github-actions[bot]
                    git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                    git add db.json
                    git diff --cached --quiet && exit 0
                    git commit -m 'Update MiSTer Downloader database'
                    git push origin main
          YAML

          cat > .github/workflows/distributed-files.yml <<'YAML'
          name: Distributed Files Pipeline
          on:
            push:
              branches: [main]
              paths:
                - Export_Game_Library.sh
                - Update_Game_Library.sh
                - mister_hash_database.tsv
          permissions:
            contents: write
          jobs:
            publish:
              uses: ./.github/workflows/publish-downloader.yml
              with:
                ref: ${{ github.sha }}
              permissions:
                contents: write
          YAML

          cat > .github/workflows/manifest-freshness.yml <<'YAML'
          name: Downloader Manifest Freshness
          on:
            push:
              branches: [main]
              paths:
                - db.json
            workflow_dispatch:
          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Verify published manifest content
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 - <<'PY'
                    import hashlib,json,re,urllib.request
                    from pathlib import Path
                    db=json.loads(Path('db.json').read_text())
                    expected={'Scripts/Export_Game_Library.sh':'Export_Game_Library.sh','Scripts/Update_Game_Library.sh':'Update_Game_Library.sh','Scripts/mister_hash_database.tsv':'mister_hash_database.tsv'}
                    for target,source in expected.items():
                        e=db['files'].get(target)
                        assert e, f'missing {target}'
                        m=re.search(r'/([0-9a-f]{40})/'+re.escape(source)+r'$',e['url'])
                        assert m, f'URL not immutable for {target}'
                        remote=urllib.request.urlopen(e['url'],timeout=30).read()
                        assert len(remote)==e['size'], f'size mismatch {target}'
                        assert hashlib.md5(remote).hexdigest()==e['hash'], f'hash mismatch {target}'
                    print('Downloader manifest is internally fresh and immutable.')
                    PY
          YAML

          rm -f .github/workflows/build-downloader-db.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          git commit -m 'Make Downloader publication explicit and reusable'
          git push
