name: Validate complete Issue 7 fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/validate-issue-7.yml"]
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Add Issue 7 regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          b=Path('tests/build_synthetic_library.py'); x=b.read_text(); m='    # The bulk profile uses an intentionally unsupported hash extension that is\n'
          assert x.count(m)==1
          add='''    # Issue #7: same fallback title, distinct authoritative canonical revisions.\n    (special / "Canonical Variant (USA) (Rev 1).sfc").write_bytes(b"issue7-rev1\\n")\n    (special / "Canonical Variant (USA) (Rev 2).sfc").write_bytes(b"issue7-rev2\\n")\n    created += 2\n\n    # Issue #7: unsupported ambiguous rows with the same fallback remain blocking.\n    ambiguous = games / "GameGear"\n    ambiguous.mkdir(parents=True, exist_ok=True)\n    (ambiguous / "Ambiguous Collision (USA) (Rev 1).gg").write_bytes(b"ambiguous-1\\n")\n    (ambiguous / "Ambiguous Collision (USA) (Rev 2).gg").write_bytes(b"ambiguous-2\\n")\n    created += 2\n\n'''
          b.write_text(x.replace(m,add+m,1))

          q=Path('tests/test_exporter_synthetic.sh'); x=q.read_text(); m='python3 - "$TEST_BIN/Export_Game_Library.sh" "$ROOT" <<\'PY\'\n'; assert x.count(m)==1
          add=r'''# Issue #7: authoritative revision pair that collides before DAT identity.
          for rev in 1 2; do
            vp="$ROOT/games/SNES/Canonical Variant (USA) (Rev $rev).sfc"
            vh=$(sha1sum "$vp" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$vh" "Canonical Variant (USA) (Rev $rev)" "Canonical Variant (USA) (Rev $rev).sfc" "Synthetic Issue #7" "12" "00000000" "00000000000000000000000000000000" "SNES" "SNES" "SNES" "USA" "Revision" "Licensed" >> "$TEST_BIN/mister_hash_database.tsv"
          done

          '''
          x=x.replace(m,add+m,1)
          x=x.replace('verdict=$(value_after_colon "Audit integrity verdict")\n','verdict=$(value_after_colon "Audit integrity verdict")\nblocking=$(value_after_colon "Blocking collision rows")\nresolved=$(value_after_colon "Canonical DAT variant rows resolved safely")\n',1)
          x=x.replace('[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n','[ "$verdict" != "FAIL" ] || fail "audit integrity verdict is FAIL"\n[ "$resolved" -eq 2 ] || fail "resolved canonical variants=$resolved expected=2"\n[ "$blocking" -eq 4 ] || fail "blocking collision rows=$blocking expected=4"\n',1)
          x=x.replace('echo "Synthetic Full Verification regression test passed."','grep -F \'Canonical Variant\' "$CATALOG" | grep -Fq \'Canonical DAT variant candidate\' || fail "canonical DAT variant candidate rows missing"\ngrep -F \'Ambiguous Collision\' "$CATALOG" | grep -Fq \'Blocking collision candidate\' || fail "unsupported blocking collision rows missing"\n\necho "Synthetic Full Verification regression test passed."',1)
          q.write_text(x)
          PY
      - name: Run full synthetic verification
        shell: bash
        run: |
          set -euo pipefail
          bash -n Export_Game_Library.sh
          bash -n tests/test_exporter_synthetic.sh
          python3 -m py_compile tests/build_synthetic_library.py
          CI=true bash tests/test_exporter_synthetic.sh
      - name: Commit validated regression coverage and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-issue-7.yml .github/workflows/apply-issue-7-v2.yml .github/workflows/apply-issue-7-v3.yml .github/workflows/validate-issue-7.yml
          git add tests/build_synthetic_library.py tests/test_exporter_synthetic.sh
          git commit -m "Add complete Issue #7 collision regressions"
          git push
