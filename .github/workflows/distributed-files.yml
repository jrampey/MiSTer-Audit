name: Distributed Files Pipeline
on:
  push:
    branches: [main]
    paths:
      - MiSTer_Audit.sh
      - mister_hash_database.tsv
      - game_identity_aliases.tsv
      - historical_us_retail.tsv
      - historical_console_eras.tsv
      - .github/workflows/distributed-files.yml
      - .github/workflows/publish-downloader.yml
      - .github/workflows/synthetic-library-test.yml
      - tests/**
      - src/**
      - tools/build_runtime.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic:
    uses: ./.github/workflows/synthetic-library-test.yml
    permissions:
      contents: read
  publish:
    needs: synthetic
    uses: ./.github/workflows/publish-downloader.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: write
