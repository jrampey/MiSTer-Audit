name: Documentation Consistency

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require documentation with implementation changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
            fi
          fi

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf 'Changed files:\n%s\n' "$CHANGED"

          runtime_changed=false
          readme_changed=false
          context_changed=false
          wiki_changed=false

          while IFS= read -r file; do
            case "$file" in
              MiSTer-Audit-Export.sh|MiSTer-Audit-Update.sh|mister_hash_database.tsv) runtime_changed=true ;;
              README.md) readme_changed=true ;;
              PROJECT_CONTEXT.md) context_changed=true ;;
              wiki/*.md) wiki_changed=true ;;
            esac
          done <<< "$CHANGED"

          if [[ "$runtime_changed" != true ]]; then
            echo "No runtime implementation files changed; documentation guard not required."
            exit 0
          fi

          missing=()
          [[ "$readme_changed" == true ]] || missing+=("README.md")
          [[ "$context_changed" == true ]] || missing+=("PROJECT_CONTEXT.md")
          [[ "$wiki_changed" == true ]] || missing+=("wiki/*.md")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Runtime behavior changed without updating all required documentation surfaces."
            printf 'Missing documentation update: %s\n' "${missing[@]}"
            exit 1
          fi

          echo "Documentation consistency check passed."
