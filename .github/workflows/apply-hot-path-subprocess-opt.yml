name: Validate exporter hot-path subprocess optimization
on:
  push:
    branches: [perf/hot-path-subprocesses]
    paths: ['.github/workflows/apply-hot-path-subprocess-opt.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply optimization
        run: python3 .github/scripts/apply-hot-path-subprocess-opt.py
      - name: Syntax validation
        run: bash -n Export_Game_Library.sh
      - name: Synthetic regression suite
        run: bash tests/test_exporter_synthetic.sh
      - name: Validate hot-path invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'region_of_set' Export_Game_Library.sh
          grep -q 'kind_of_set' Export_Game_Library.sh
          grep -q 'clean_title_set' Export_Game_Library.sh
          grep -q 'suffix_for_set' Export_Game_Library.sh
          grep -q 'location_status_set' Export_Game_Library.sh
          ! grep -q "find .* -delete" Export_Game_Library.sh
          grep -q 'Export_Game_Library_v1.3.sh' Export_Game_Library.sh
          grep -q 'FULL_VERIFY_WORKERS=2' Export_Game_Library.sh
      - name: Commit validated exporter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Export_Game_Library.sh
          git commit -m 'Reduce exporter hot-path subprocesses'
          git push
