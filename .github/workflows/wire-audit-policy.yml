name: Validate audit policy wiring

on:
  push:
    branches: [feature/arcade-organizer-lessons]
    paths:
      - "AUDIT_POLICY.conf"
      - "Export_Game_Library.sh"
      - ".github/scripts/wire-audit-policy.py"
      - ".github/workflows/wire-audit-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arcade-organizer-lessons

      - name: Wire policy into exporter
        run: python3 .github/scripts/wire-audit-policy.py

      - name: Validate syntax
        run: bash -n Export_Game_Library.sh

      - name: Validate default policy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          policy = {}
          for raw in Path("AUDIT_POLICY.conf").read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              policy[key.strip()] = value.strip()

          expected = {
              "COMPLETION_REGIONS": "USA",
              "COMPLETION_INCLUDE_WORLD": "1",
              "COMPLETION_RETAIL_ONLY": "1",
              "COMPLETION_INCLUDE_PROTOTYPES": "0",
              "COMPLETION_INCLUDE_BETA": "0",
              "COMPLETION_INCLUDE_DEMOS": "0",
          }
          assert policy == expected, (policy, expected)
          print("PASS policy-file defaults:", policy)
          PY

          awk '/^# AUDIT POLICY$/{capture=1} capture{print} /^load_audit_policy$/{exit}' Export_Game_Library.sh \
            | sed '$d' > /tmp/policy-block.sh

          run_policy() {
            local policy_path="$1"
            POLICY_TEST_PATH="$policy_path" bash -c '
              source /tmp/policy-block.sh
              AUDIT_POLICY_FILE="$POLICY_TEST_PATH"
              load_audit_policy
              printf "%s|%s|%s|%s|%s|%s\n" \
                "${COMPLETION_REGIONS[*]}" \
                "$COMPLETION_INCLUDE_WORLD" \
                "$COMPLETION_RETAIL_ONLY" \
                "$COMPLETION_INCLUDE_PROTOTYPES" \
                "$COMPLETION_INCLUDE_BETA" \
                "$COMPLETION_INCLUDE_DEMOS"
            '
          }

          assert_policy() {
            local name="$1" expected="$2" policy_path="$3" actual
            actual="$(run_policy "$policy_path")"
            printf '%s: expected=[%s] actual=[%s]\n' "$name" "$expected" "$actual"
            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL: $name policy behavior mismatch" >&2
              return 1
            fi
            echo "PASS: $name"
          }

          assert_policy default 'USA|1|1|0|0|0' "$PWD/AUDIT_POLICY.conf"

          mkdir -p /tmp/policy-missing
          rm -f /tmp/policy-missing/AUDIT_POLICY.conf
          assert_policy missing 'USA|1|1|0|0|0' /tmp/policy-missing/AUDIT_POLICY.conf

          mkdir -p /tmp/policy-invalid
          cat > /tmp/policy-invalid/AUDIT_POLICY.conf <<'EOF'
          COMPLETION_REGIONS=
          COMPLETION_INCLUDE_WORLD=garbage
          COMPLETION_RETAIL_ONLY=2
          COMPLETION_INCLUDE_PROTOTYPES=no
          COMPLETION_INCLUDE_BETA=-1
          COMPLETION_INCLUDE_DEMOS=yes
          EOF
          assert_policy invalid 'USA|1|1|0|0|0' /tmp/policy-invalid/AUDIT_POLICY.conf

          mkdir -p /tmp/policy-custom
          cat > /tmp/policy-custom/AUDIT_POLICY.conf <<'EOF'
          COMPLETION_REGIONS=USA,Europe
          COMPLETION_INCLUDE_WORLD=0
          COMPLETION_RETAIL_ONLY=0
          COMPLETION_INCLUDE_PROTOTYPES=1
          COMPLETION_INCLUDE_BETA=1
          COMPLETION_INCLUDE_DEMOS=1
          EOF
          assert_policy custom 'USA Europe|0|0|1|1|1' /tmp/policy-custom/AUDIT_POLICY.conf

          mkdir -p /tmp/policy-safe
          rm -f /tmp/policy-owned
          cat > /tmp/policy-safe/AUDIT_POLICY.conf <<'EOF'
          COMPLETION_REGIONS=USA
          EVIL=$(touch /tmp/policy-owned)
          COMPLETION_INCLUDE_WORLD=1
          EOF
          safe_actual="$(run_policy /tmp/policy-safe/AUDIT_POLICY.conf)"
          printf 'safe: actual=[%s] side_effect=%s\n' "$safe_actual" "$([[ -e /tmp/policy-owned ]] && echo present || echo absent)"
          if [[ -e /tmp/policy-owned ]]; then
            echo 'FAIL: policy parser executed untrusted shell content' >&2
            exit 1
          fi
          echo 'PASS: safe/non-execution'

      - name: Validate v1.3 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx '# Export_Game_Library_v1.3.sh' Export_Game_Library.sh
          grep -Fqx 'FULL_VERIFY_WORKERS=2' Export_Game_Library.sh
          git diff --exit-code HEAD -- Update_Game_Library.sh

      - name: Synthetic regression
        run: bash tests/test_exporter_synthetic.sh

      - name: Commit validated exporter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Export_Game_Library.sh
          if git diff --cached --quiet; then
            echo "Exporter already wired."
            exit 0
          fi
          git commit -m "Wire audit policy into exporter"
          git push origin HEAD:feature/arcade-organizer-lessons
