name: Apply exporter runtime progress patch
on:
  push:
    paths:
      - '.github/workflows/apply-exporter-perf2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exporter
        run: python3 .github/scripts/apply-exporter-perf2.py
      - name: Validate exporter
        run: |
          bash -n Export_Game_Library.sh
          grep -F 'Build: %-41s' Export_Game_Library.sh
          grep -F 'Full Verification: hashing $HASH_JOB_TOTAL supported files' Export_Game_Library.sh
          grep -F 'HASH_NEXT_STATUS=500' Export_Game_Library.sh
          bash tests/test_exporter_synthetic.sh
      - name: Commit exporter fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Export_Game_Library.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Show hash progress every 500 files'
          git push
# runtime-progress-patch
# hash-status-cadence-500
