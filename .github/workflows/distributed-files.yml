name: Distributed Files Pipeline
on:
  push:
    branches: [main]
    paths:
      - MiSTer_Audit.sh
      - mister_hash_database.tsv
      - .github/workflows/distributed-files.yml
      - .github/workflows/publish-downloader.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: ./.github/workflows/publish-downloader.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: write
# Publication trigger: Fast Audit timing telemetry
